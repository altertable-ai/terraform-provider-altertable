name: Acceptance Tests

on:
  schedule:
    - cron: "30 7 * * 1-5" # 07:30 UTC, Monday–Friday
  workflow_dispatch:


jobs:
  testacc:
    runs-on: ubuntu-latest
    timeout-minutes: 130 # backstop above the Makefile's `go test -timeout 120m`
    env:
      # Staging credentials.
      ALTERTABLE_API_KEY: ${{ secrets.ALTERTABLE_API_KEY }}
      ALTERTABLE_API_URL: ${{ secrets.ALTERTABLE_API_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false # the acceptance-test framework parses raw terraform output
      - run: go mod download
      - run: make testacc # TF_ACC=1 go test ./... -count=1 -timeout 120m
